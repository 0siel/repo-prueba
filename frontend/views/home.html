<section class="hero">
  <h2>{{ nombreClinica }}</h2>
  <p>{{ mensaje }}</p>
  <div class="hero-actions">
    <a href="#!/agendar" class="btn-cta">Agendar Cita</a>
    <a href="#!/consultar" class="btn-cta btn-cta-secondary">Consultar Cita</a>
  </div>
</section>

<section class="servicios-section">
  <h3>Nuestros Servicios</h3>
  <div class="servicios-grid">
    <div class="servicio-card" ng-repeat="servicio in servicios">
      <h4>{{ servicio.nombre }}</h4>
      <p>{{ servicio.descripcion }}</p>
    </div>
  </div>
</section>
