<section class="form-section">
  <h2>Iniciar Sesión</h2>

  <div class="alert alert-error" ng-if="error">
    {{ error }}
  </div>

  <form name="loginForm" ng-submit="login()" novalidate>

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username"
             ng-model="credenciales.username"
             required placeholder="Tu usuario">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password"
             ng-model="credenciales.password"
             required placeholder="Tu contraseña">
    </div>

    <button type="submit" ng-disabled="loginForm.$invalid || enviando">
      {{ enviando ? 'Ingresando...' : 'Ingresar' }}
    </button>

  </form>

  <p class="back-link"><a href="#!/">Volver al inicio</a></p>
</section>
