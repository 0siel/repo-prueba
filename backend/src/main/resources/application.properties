spring.application.name=backend

# Configuracion de Oracle DB (Usa variables de entorno si existen, sino usa localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:patitas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:patitas_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect